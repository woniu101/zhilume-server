<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self';"
    />
    <title>Zhilume Server · 启动器 · 织镜</title>
    <link rel="stylesheet" href="launcher.css" />
  </head>
  <body>
    <header>
      <div>
        <img
          class="symbol"
          src="../assets/icon.svg"
          alt=""
          width="40"
          height="40"
        /><strong>Zhilume <small>SERVER</small></strong>
      </div>
      <button id="theme" title="切换深浅主题">◐</button>
    </header>
    <main>
      <span class="eyebrow">YOUR CREATIVE INFRASTRUCTURE</span>
      <h1>启动你的创作服务。</h1>
      <p>管理项目和素材，连接本地或云端 Worker。</p>
      <section>
        <div class="status">
          <span id="dot"></span><strong id="status">服务未启动</strong
          ><code id="address">127.0.0.1:4310</code>
        </div>
        <div class="buttons">
          <button id="start" class="primary">启动并打开管理台</button
          ><button id="stop">停止服务</button
          ><button id="open">打开管理台</button
          ><button id="copy">复制访问凭证</button>
        </div>
        <p id="message" role="status">
          启动后自动打开本机管理台。连接 Studio 或外部浏览器时，复制访问凭证使用。
        </p>
      </section>
      <details>
        <summary>服务配置</summary>
        <label
          >监听端口<input
            id="port"
            type="number"
            min="1024"
            max="65535"
            value="4310" /></label
        ><label>数据目录<input id="data-path" readonly /></label>
        <div class="buttons">
          <button id="directory-picker">选择目录</button
          ><button id="configure">保存配置</button
          ><button id="browser">在浏览器打开管理台 ↗</button>
        </div>
        <p>更换目录不会迁移原有项目。服务运行时关闭启动器会收起到托盘。</p>
      </details>
      <h2>运行日志</h2>
      <pre id="logs">等待服务启动…</pre>
      <div class="foot">
        <span>数据保存在</span><code id="directory"></code>
      </div>
      <p class="note">
        Server 独立管理项目、素材和任务；关闭 Studio 或管理台不会停止服务。
      </p>
    </main>
    <script src="launcher.js"></script>
  </body>
</html>
