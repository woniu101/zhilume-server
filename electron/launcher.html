<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self';"
    />
    <title>Zhilume Server · 启动器 · 织镜</title>
    <link rel="stylesheet" href="launcher.css" />
  </head>
  <body>
    <header>
      <div>
        <img
          class="symbol"
          src="../assets/icon.svg"
          alt=""
          width="40"
          height="40"
        /><strong>Zhilume <small>SERVER</small></strong>
      </div>
      <button id="theme" title="切换深浅主题">◐</button>
    </header>
    <main>
      <span class="eyebrow">YOUR CREATIVE INFRASTRUCTURE</span>
      <h1>启动你的创作服务。</h1>
      <p>管理项目和素材，连接本地或云端 Worker。</p>
      <section>
        <div class="status">
          <span id="dot"></span><strong id="status">服务未启动</strong
          ><code id="address">127.0.0.1:4310</code>
        </div>
        <div class="buttons">
          <button id="start" class="primary">启动 Server</button
          ><button id="stop">停止服务</button
          ><button id="open">打开管理台</button
          ><button id="copy">复制访问凭证</button>
        </div>
        <p id="message" role="status">
          服务就绪后点击“打开管理台”。连接 Studio 或外部浏览器时，复制访问凭证使用。
        </p>
      </section>
      <details>
        <summary>服务配置</summary>
        <label
          >监听端口<input
            id="port"
            type="number"
            min="1024"
            max="65535"
            value="4310" /></label
        ><label>数据目录<input id="data-path" readonly /></label>
        <div class="buttons">
          <button id="directory-picker">选择目录</button
          ><button id="configure">保存配置</button
          ><button id="browser">在浏览器打开管理台 ↗</button>
        </div>
        <p>更换目录不会迁移原有项目。终端默认使用相同配置与凭证。</p>
      </details>
      <details>
        <summary>启动器设置</summary>
        <label>点击关闭按钮时<select id="close-behavior">
          <option value="ask">每次询问</option>
          <option value="tray">最小化到托盘，保留服务</option>
          <option value="quit">停止服务并退出</option>
        </select></label>
        <p>立即保存，仅影响启动器的关闭按钮；关闭管理台不会停止服务。</p>
      </details>
      <h2>运行日志</h2>
      <pre id="logs">等待服务启动…</pre>
      <div class="foot">
        <span>数据保存在</span><code id="directory"></code>
      </div>
      <p class="note">
        Server 独立管理项目、素材和任务；关闭 Studio 或管理台不会停止服务。
      </p>
    </main>
    <dialog id="confirmation" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-description">
      <form id="confirm-form">
        <div class="confirm-heading">
          <div class="confirm-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9m-5.6-7a8 8 0 1 0 11.2 0"/></svg>
          </div>
          <button id="confirm-dismiss" type="button" class="dismiss" aria-label="取消关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
        <h2 id="confirm-title">关闭启动器</h2>
        <p id="confirm-description"></p>
        <div id="close-options" class="close-options" role="radiogroup" aria-label="关闭方式">
          <label class="close-option"><input type="radio" name="close-action" value="tray" checked /><span><strong>收起到托盘</strong><small id="tray-description"></small></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4M8 10h8"/></svg></label>
          <label class="close-option"><input type="radio" name="close-action" value="quit" /><span><strong id="quit-label">停止服务并退出</strong><small id="quit-description"></small></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 4H5v16h4m-1-8h13m-5-5 5 5-5 5"/></svg></label>
        </div>
        <label id="remember-option" class="remember-option"><input type="checkbox" id="confirm-remember" /><span>记住选择</span><small>可在启动器设置中修改</small></label>
        <p id="confirm-error" class="confirm-error" role="alert" hidden></p>
        <div class="confirm-actions"><button id="confirm-cancel" type="button">取消</button><button id="confirm-submit" type="submit" class="primary">收起到托盘</button></div>
      </form>
    </dialog>
    <script src="launcher.js"></script>
  </body>
</html>
